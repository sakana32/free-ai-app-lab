name: Free Autonomous App Lab

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autonomous-app
  cancel-in-progress: false

jobs:
  develop-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: ai-autopilot-starter
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure Node for syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Gemini Python SDK
        run: python -m pip install 'google-genai>=1.0,<2'
      - name: Autonomous research and app development
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python agent.py
      - name: Commit progress
        run: |
          git config user.name "autonomous-app-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css app.js state.json PROGRESS.md RESEARCH.md
          if ! git diff --cached --quiet; then
            git commit -m "bot: improve app and record research"
            git push
          fi
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html style.css app.js _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-autopilot-starter/_site
      - name: Publish website
        id: deploy
        uses: actions/deploy-pages@v4
